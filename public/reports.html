<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Reports — EventLy</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<template id="page-body">
    <div class="page-toolbar">
        <div>
            <h2>Booking Reports</h2>
            <div class="sub">Filter bookings by date range and status, then export to CSV.</div>
        </div>
        <div class="toolbar-actions">
            <button class="btn btn-ghost" id="exportBtn">⬇ Export CSV</button>
        </div>
    </div>

    <div class="panel" style="margin-bottom:20px;">
        <div class="form-row" style="grid-template-columns: 1fr 1fr 1fr 1fr; align-items:end;">
            <div class="field" style="margin-bottom:0;"><label>From date</label><input type="date" id="fromDate"></div>
            <div class="field" style="margin-bottom:0;"><label>To date</label><input type="date" id="toDate"></div>
            <div class="field" style="margin-bottom:0;">
                <label>Booking status</label>
                <select id="reportStatus" class="filter-select" style="width:100%;">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <button class="btn btn-primary" id="applyFilterBtn">Apply Filters</button>
        </div>
    </div>

    <div class="summary-strip" id="summaryStrip"></div>

    <div class="panel">
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>Code</th><th>Event</th><th>Venue</th><th>Participant</th><th>Tickets</th><th>Amount</th><th>Booking</th><th>Payment</th><th>Created</th></tr></thead>
                <tbody id="reportBody"><tr class="loading-row"><td colspan="9">Loading report...</td></tr></tbody>
            </table>
        </div>
    </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/reports.js"></script>
</body>
</html>

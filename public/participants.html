<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Participants — EventLy</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<template id="page-body">
    <div class="page-toolbar">
        <div>
            <h2>Participants</h2>
            <div class="sub">Everyone who has registered or booked for an event.</div>
        </div>
        <div class="toolbar-actions">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Search participants...">
            </div>
            <button class="btn btn-primary" id="addParticipantBtn">+ Add Participant</button>
        </div>
    </div>

    <div class="panel">
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Joined</th><th>Actions</th></tr></thead>
                <tbody id="participantsBody"><tr class="loading-row"><td colspan="6">Loading participants...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="participantModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="participantModalTitle">Add Participant</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="participantForm">
                    <input type="hidden" id="participant_id">
                    <div class="field"><label>Full name</label><input type="text" id="participant_name" required></div>
                    <div class="field"><label>Email</label><input type="email" id="participant_email" required></div>
                    <div class="field"><label>Phone</label><input type="text" id="participant_phone"></div>
                    <div class="field"><label>Address</label><textarea id="participant_address" rows="2"></textarea></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="saveParticipantBtn">Save Participant</button>
            </div>
        </div>
    </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/participants.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — EventLy</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<template id="page-body">
    <div class="page-toolbar">
        <div>
            <h2>Bookings</h2>
            <div class="sub">Track every reservation from request to confirmation.</div>
        </div>
        <div class="toolbar-actions">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Search by code, event, participant...">
            </div>
            <select class="filter-select" id="statusFilter">
                <option value="">All statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <button class="btn btn-primary" id="addBookingBtn">+ New Booking</button>
        </div>
    </div>

    <div class="panel">
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>Code</th><th>Event</th><th>Participant</th><th>Tickets</th><th>Amount</th><th>Booking Status</th><th>Payment</th><th>Actions</th></tr></thead>
                <tbody id="bookingsBody"><tr class="loading-row"><td colspan="8">Loading bookings...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="bookingModal">
        <div class="modal">
            <div class="modal-header"><h3>New Booking</h3><button class="modal-close">&times;</button></div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="field"><label>Event</label><select id="booking_event" required></select></div>
                    <div class="field"><label>Participant</label><select id="booking_participant" required></select></div>
                    <div class="field"><label>Number of tickets</label><input type="number" id="booking_tickets" min="1" value="1" required></div>
                    <div id="bookingEstimate" style="background:var(--cream-100);border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink-600);display:none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="saveBookingBtn">Create Booking</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="statusModal">
        <div class="modal">
            <div class="modal-header"><h3>Update Booking Status</h3><button class="modal-close">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="status_booking_id">
                <div class="field">
                    <label>New status</label>
                    <select id="new_booking_status">
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="updateStatusBtn">Update</button>
            </div>
        </div>
    </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/bookings.js"></script>
</body>
</html>

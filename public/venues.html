<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venues — EventLy</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<template id="page-body">
    <div class="page-toolbar">
        <div>
            <h2>Venues</h2>
            <div class="sub">Manage the physical spaces you host events at.</div>
        </div>
        <div class="toolbar-actions">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Search venues...">
            </div>
            <button class="btn btn-primary" id="addVenueBtn">+ Add Venue</button>
        </div>
    </div>

    <div class="panel">
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>Venue</th><th>Location</th><th>Capacity</th><th>Price / Day</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="venuesBody"><tr class="loading-row"><td colspan="6">Loading venues...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="venueModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="venueModalTitle">Add Venue</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="venueForm">
                    <input type="hidden" id="venue_id">
                    <div class="field"><label>Venue name</label><input type="text" id="venue_name" required></div>
                    <div class="field"><label>Location</label><input type="text" id="venue_location" required></div>
                    <div class="form-row">
                        <div class="field"><label>Capacity</label><input type="number" id="venue_capacity" min="1" required></div>
                        <div class="field"><label>Price per day (₹)</label><input type="number" id="venue_price" min="0" step="0.01" required></div>
                    </div>
                    <div class="field"><label>Amenities</label><textarea id="venue_amenities" rows="2" placeholder="AC, Sound System, Parking..."></textarea></div>
                    <div class="field">
                        <label>Status</label>
                        <select id="venue_status">
                            <option value="available">Available</option>
                            <option value="unavailable">Unavailable</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-modal-close>Cancel</button>
                <button class="btn btn-primary" id="saveVenueBtn">Save Venue</button>
            </div>
        </div>
    </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/venues.js"></script>
</body>
</html>
